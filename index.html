<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Only Fathers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap');

  :root {
    --graf: #15181A;
    --graf2: #1E2225;
    --crudo: #ECE6DA;
    --musgo: #4C6B54;
    --musgo-claro: #7C9A80;
    --bronce: #C9A24B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--graf);
    color: var(--crudo);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vw 6vw 4vw;
  }

  main {
    max-width: 1100px;
    width: 100%;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 4rem;
    align-items: center;
  }

  .eyebrow {
    font-size: 0.85rem;
    color: var(--musgo-claro);
    letter-spacing: 0.02em;
    margin-bottom: 1.2rem;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 8vw, 6.5rem);
    line-height: 0.92;
    letter-spacing: 0.01em;
  }

  h1 .linea2 { color: var(--musgo-claro); }

  p.tag {
    margin-top: 1.5rem;
    max-width: 34ch;
    color: #B9B2A4;
    font-size: 1.05rem;
    line-height: 1.55;
  }

  .cta {
    display: inline-block;
    margin-top: 2.2rem;
    padding: 0.85rem 1.8rem;
    background: var(--musgo);
    color: var(--crudo);
    text-decoration: none;
    font-weight: 600;
    border-radius: 3px;
    transition: background 0.2s ease;
  }
  .cta:hover { background: var(--musgo-claro); }

  .ilustracion {
    position: relative;
  }

  .ilustracion img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  }

  @media (max-width: 760px) {
    main {
      grid-template-columns: 1fr;
      text-align: left;
    }
    .ilustracion { order: -1; max-width: 340px; }
  }
</style>
</head>
<body>
<main>
  <div>
    <h1>ONLY<br><span class="linea2">FATHERS</span></h1>
    <p class="tag">Padres ESPAÑOLES Y ENCABRONADOS, intentando rehacer un país para que vuelva a ser grande y libre.</p>
  </div>

  <div class="ilustracion">
    <img src="fotoOnlyFathers.jfif" alt="Padres de Only Fathers" />
  </div>
</main>
</body>
</html>
